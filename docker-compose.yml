services:

  mysql:
    image: mysql:8.4
    container_name: myapp_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - myapp_network


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myapp_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "${PHPMYADMIN_PORT}:80"

    depends_on:
      - mysql

    networks:
      - myapp_network


  # =========================
  # GO BACKEND
  # =========================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: innolabs_backend
    restart: unless-stopped

    env_file:
      - .env

    # Override riêng khi chạy Docker
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306

    ports:
      - "5000:8080"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - myapp_network



  frontend:
    build:
      context: ./innolabs-dashboard
      dockerfile: Dockerfile

    container_name: innolabs_frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - myapp_network


volumes:
  mysql_data:


networks:
  myapp_network: